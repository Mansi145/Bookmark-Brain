services:
  db:
    # Postgres 16 with the pgvector extension preinstalled (same as Neon in prod).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: bb
      POSTGRES_DB: bookmark_brain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb -d bookmark_brain"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
